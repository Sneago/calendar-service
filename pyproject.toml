[project]
name = "calendar-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Julia Snezhko",email = "julia.sneg2@gmail.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
dev = [
    "wemake-python-styleguide (>=1.8.1,<2.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
]


[tool.poetry]
package-mode = false


[tool.ruff]
target-version = "py314"
line-length = 95
extend-exclude = ["*/migrations/*"]
preview = true
fix = true
output-prefer-rule-codes = true


[tool.ruff.format]
quote-style = "double"


[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "C90",  # mccabe
  "COM",  # flake8-commas
  "D",    # pydocstyle
  "DJ",   # flake8-django
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle
  "ERA",  # flake8-eradicate
  "EXE",  # flake8-executable
  "F",    # pyflakes
  "FA",   # flake8-future-annotations
  "FBT",  # flake8-boolean-trap
  "FLY",  # flynt
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "PERF", # perflint
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "T100", # flake8-debugger
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle
  "YTT",  # flake8-2020
]
ignore = [
  "COM812",
  "D100",
  "D104",
  "D106",    # nested `class Meta` needs no docstring
  "D203",
  "D212",
  "D401",
  "D404",
  "D405",
  "ISC001",
  "ISC003",  # prefer explicit string concat over implicit concat
  "PLR09",   # WPS has its own complexity rules
  "PLR2004", # WPS reports magic numbers
  "PLR6301", # do not require classmethod / staticmethod when self not used
  "RUF012",  # Django `Meta`/DRF class attrs are mutable by design
  "RUF067",  # WPS handles `__init__.py` logic better
  "RUF105",  # keep old `# noqa` comments style, not `# ruff` comments
  "RUF106",  # prefer old error codes
  "RUF201",  # keep old rule codes instead of verbose names
  "TRY003",  # long exception messages
]
external = ["WPS"]
flake8-import-conventions.aliases = { datetime = "dt" }
flake8-import-conventions.banned-from = ["ast", "datetime"]
flake8-quotes.inline-quotes = "double"
mccabe.max-complexity = 6
pydocstyle.convention = "google"


[tool.ruff.lint.per-file-ignores]
"manage.py" = ["PLC0415"]
